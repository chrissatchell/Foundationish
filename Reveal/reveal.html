<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Reveal - Foundation(ish) Accessible Components</title>
        <link rel="stylesheet" href="./reveal.css" />
        <style>
            body {
                padding: 2rem
            }
            button {

            }
        </style>
	</head>
	<body class="superbody">

        <h1>
            <code>
                &lt;reveal-dialog modal&gt;
            </code>
        </h1>

        <br>

        <reveal-dialog>

            <button data-open="reveal-dialog" id="reveal-trigger">
                <style>
                    @scope {
                        :scope {
                            padding: 0.25em 0.75em;
                            border-radius: 0.3em;
                        }
                    }
                </style>
                View All
            </button>

            <dialog aria-modal="true" id="reveal-dialog" class="full-page full-height">

                <div class="dialog-page">

                    <div class="dialog-container">

                        <div class="dialog-body">

                            <div class="dialog-header">

                                <button class="close" aria-label="Close the dialog" popovertarget="reveal-dialog" popovertargetaction="hide">
                                    &#10005;
                                </button>

                            </div>

                            <div class="dialog-content">

                                <div class="popover-container">

                                    <ul class="projects-summaries">

                                        <li class="project-summary">
                                            <div class="project-card">
                                                <div class="project-card__body">
                                                    <h3>EllisDon Developments</h3>
                                                    <a href="https://ellisdondevelopments.com/" class="project-link" target="_blank" rel="noopener noreferrer">ellisdondevelopments.com</a>
                                                </div>
                                                <div class="project-card__meta">
                                                    <div class="project-meta">
                                                        <p><b>Responsibilies &amp; Roles</b></p>
                                                        <ul class="project-roles" aria-label="Responsibilies &amp; Roles">
                                                            <li>Front-End Development<span>,</span></li>
                                                            <li>Theme Development<span>,</span></li>
                                                        </ul>
                                                    </div>
                                                    <div class="project-meta">
                                                        <p><b>Tech Stack</b></p>
                                                        <ul class="project-tags" aria-label="Technology">
                                                            <li>PHP<span>,</span></li>
                                                            <li>WordPress<span>,</span></li>
                                                        </ul>
                                                    </div>
                                                    <div class="project-meta">
                                                        <p class="project-agency">
                                                            <b>Agency</b> nvision
                                                        </p>
                                                    </div>
                                                    <div class="project-meta">
                                                        <p class="project-status">
                                                            <b>Status</b> live
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        </li>

                                    </ul>

                                </div>

                            </div>


                        </div>

                    </div>

                </div>

            </dialog>

        </reveal-dialog>

    <script src="./reveal.js"></script>
    </body>
</html>
