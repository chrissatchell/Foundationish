        <style>
            section {
                position: relative;
                margin: 10rem 2rem 2rem;
            }

            /* 1. Define the anchor name on the button */
            #mii-button {
                anchor-name: --button-anchor;
            }

            /* 2. Base styles for the popover (CLOSED STATE) */
            #mii-popover {
                --duration: 0.15s;

                /* Remove default center positioning */
                position: absolute;
                inset: auto;

                /* Connect the popover to the anchor name */
                position-anchor: --button-anchor;

                /* Align the top of the popover to the bottom of the button */
                top: anchor(bottom);

                /* Align the right edge of the popover to the right edge of the button */
                left: anchor(right);

                /* Apply the fade-out animation timeline by default when closing */
                animation: fade-out var(--duration) ease-in-out forwards;

                /* CRITICAL: Allows discrete properties like 'display' and 'overlay'
                to smoothly transition alongside our keyframe animations */
                /* overlay Tells the top-layer engine to wait var(--duration) before dropping the element */
                transition: display var(--duration) allow-discrete, overlay var(--duration) allow-discrete;

                /*
                    NOTE about overlay

                    In the context of CSS entry and exit animations (especially for elements like popover or <dialog>), overlay is a native CSS property that controls whether an element is rendered in the browser's Top Layer.

                    The Top Layer is a special, invisible plane in the browser window that sits above all other elements on the page, completely ignoring standard z-index rules or stacking contexts.

                    Why do we need the overlay property?
                    Historically, when you opened a modal or popup, the browser instantly slapped it onto the top layer. When you closed it, the browser instantly stripped it from the top layer.

                    Because this happened instantaneously, it was impossible to animate a fade-out. The exact moment your popover lost its :popover-open state, it fell off the top layer and vanished behind other elements, completely skipping your var(--duration) fade-out timeline.

                    How it works with animations
                    By adding overlay to your CSS transition list with the allow-discrete modifier, you tell the browser:

                    "When this popover closes, don't kick it out of the top layer immediately. Keep it up there on top for the duration of the animation so the user can actually see it fade away."
                */
            }

            /* 3. Styles when the popover is OPEN */
            #mii-popover:popover-open {
                /* Apply the fade-in animation when opening */
                animation: fade-in var(--duration) ease-in-out forwards;
            }

            /* 4. The starting state *before* it opens */
            @starting-style {
                #mii-popover:popover-open {
                    opacity: 0;
                }
            }

            /* 5. Keyframe Definitions */
            @keyframes fade-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @keyframes fade-out {
                from {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                }
            }
        </style>
